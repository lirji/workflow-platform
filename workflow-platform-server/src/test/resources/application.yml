# Phase 0 兼容 spike:用 H2 内嵌库,不依赖外部 PostgreSQL,快速坐实 Flowable 引擎启动与执行
server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:wf-spike;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    # H2 spike 不需要 wf_* 平台表(PG 专用 SQL);wf_* 迁移由 phase1-migration-smoke.sh / Testcontainers 覆盖
    enabled: false
  kafka:
    listener:
      auto-startup: false

flowable:
  database-schema-update: true
  # 测试里手动驱动流程,关掉 async executor 避免后台线程干扰断言
  async-executor-activate: false
  check-process-definitions: false

# H2 spike 测试不需要 Kafka 监听与 outbox/correlation 定时作业(否则空跑报 wf_ 表不存在)
workflow:
  jobs:
    enabled: false
