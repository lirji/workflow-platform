server:
  port: 8300
  # Casdoor JWT(含 groups)约 9KB;不放大默认 8KB 上限会让合法 token 报 400(接入指南坑)。
  max-http-request-header-size: 64KB

spring:
  application:
    name: workflow-platform-server
  datasource:
    url: ${WORKFLOW_DB_URL:jdbc:postgresql://localhost:25432/workflow}
    username: ${WORKFLOW_DB_USER:workflow}
    password: ${WORKFLOW_DB_PASSWORD:workflow}
    driver-class-name: org.postgresql.Driver
  flyway:
    # 库里已有 Flowable 自建的 ACT_*,Flyway 首跑需 baseline 既有 schema 再应用 wf_* 迁移
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    # 复用 his-platform 现有 broker(FINAL_PLAN 偏差 P1-5);workflow.* 为独立 topic
    bootstrap-servers: ${WORKFLOW_KAFKA:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # producer 必须早于应用等待预算给出最终失败；异常情况下应用超时会落 DELIVERY_UNKNOWN，绝不伪装 FAILED。
        delivery.timeout.ms: ${WORKFLOW_KAFKA_DELIVERY_TIMEOUT_MS:8000}
        request.timeout.ms: ${WORKFLOW_KAFKA_REQUEST_TIMEOUT_MS:5000}
        max.block.ms: ${WORKFLOW_KAFKA_MAX_BLOCK_MS:5000}
    consumer:
      group-id: workflow-server
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

workflow:
  outbox:
    batch-size: 100
    poll-ms: 1000
    lease-seconds: 30
    # producer max.block + 单次 broker ACK 等待必须严格小于 lease；明确失败达上限进入 FAILED。
    send-timeout-seconds: ${WORKFLOW_OUTBOX_SEND_TIMEOUT_SECONDS:10}
    max-attempts: ${WORKFLOW_OUTBOX_MAX_ATTEMPTS:10}
    retry-backoff-seconds: ${WORKFLOW_OUTBOX_RETRY_BACKOFF_SECONDS:5}
  dlq:
    # 监听重试总尝试次数(含初次);超限后由 recoverer 投 workflow.dlq.v1。
    max-attempts: 3
    backoff-ms: 1000
  flowable:
    # 异步执行器线程池调优(按部署压测结果调整;多副本时每副本各一套池)。
    async-core-pool: ${WORKFLOW_ASYNC_CORE_POOL:8}
    async-max-pool: ${WORKFLOW_ASYNC_MAX_POOL:8}
    async-queue-size: ${WORKFLOW_ASYNC_QUEUE:100}
    async-max-jobs-per-acquisition: ${WORKFLOW_ASYNC_MAX_JOBS:8}
  security:
    # 鉴权分期:默认关(保 shadow 联调明文头路径);生产置 true 接 Casdoor JWT。
    enabled: ${WORKFLOW_SECURITY_ENABLED:false}
    # issuer 与 jwks 二选一;优先 jwks(lazy,不阻塞启动)。
    issuer-uri: ${WORKFLOW_OIDC_ISSUER:}
    jwk-set-uri: ${WORKFLOW_OIDC_JWKS:}
    groups-claim: ${WORKFLOW_GROUPS_CLAIM:groups}
    # 生产必填：只接受签发给 workflow-platform 的 access token。
    audience: ${WORKFLOW_OIDC_AUDIENCE:}
    # prod profile 强制非空；dev/shadow 未配置时才回退 X-Workflow-Tenant 头。
    tenant-claim: ${WORKFLOW_TENANT_CLAIM:}
  kafka-trust:
    # source→tenant allowlist + 原始 JSON HMAC；prod profile 强制开启并配置。broker 仍需 SASL/TLS/ACL。
    enabled: ${WORKFLOW_KAFKA_TRUST_ENABLED:false}
    source-tenant-bindings: ${WORKFLOW_KAFKA_SOURCE_TENANT_BINDINGS:}
    source-signing-keys: ${WORKFLOW_KAFKA_SOURCE_SIGNING_KEYS:}

flowable:
  # dev 默认 true(引擎自建/升级 ACT_*);生产置 false —— 用固化官方 DDL 初始化 ACT_*(见 ADR 0001 / deploy/postgres/flowable-7.1.0)。
  database-schema-update: ${WORKFLOW_FLOWABLE_SCHEMA_UPDATE:true}
  # server 承载运行时,开启 async executor 驱动 timer/异步任务(多副本各自运行,作业获取用 ACT_RU_JOB 锁多节点安全)
  async-executor-activate: ${WORKFLOW_ASYNC_EXECUTOR:true}
  # 自动部署由 admin 负责;server 不从 classpath 自动部署,避免双写
  check-process-definitions: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
