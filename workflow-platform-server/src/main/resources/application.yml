server:
  port: 8300

spring:
  application:
    name: workflow-platform-server
  datasource:
    url: ${WORKFLOW_DB_URL:jdbc:postgresql://localhost:25432/workflow}
    username: ${WORKFLOW_DB_USER:workflow}
    password: ${WORKFLOW_DB_PASSWORD:workflow}
    driver-class-name: org.postgresql.Driver
  flyway:
    # 库里已有 Flowable 自建的 ACT_*,Flyway 首跑需 baseline 既有 schema 再应用 wf_* 迁移
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    # 复用 his-platform 现有 broker(FINAL_PLAN 偏差 P1-5);workflow.* 为独立 topic
    bootstrap-servers: ${WORKFLOW_KAFKA:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: workflow-server
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

workflow:
  outbox:
    batch-size: 100
    poll-ms: 1000
    lease-seconds: 30
  dlq:
    # 监听重试总尝试次数(含初次);超限后由 recoverer 投 workflow.dlq.v1。
    max-attempts: 3
    backoff-ms: 1000
  security:
    # 鉴权分期:默认关(保 shadow 联调明文头路径);生产置 true 接 Casdoor JWT。
    enabled: ${WORKFLOW_SECURITY_ENABLED:false}
    # issuer 与 jwks 二选一;优先 jwks(lazy,不阻塞启动)。
    issuer-uri: ${WORKFLOW_OIDC_ISSUER:}
    jwk-set-uri: ${WORKFLOW_OIDC_JWKS:}
    groups-claim: ${WORKFLOW_GROUPS_CLAIM:groups}
    # 为空则租户仍取 X-Workflow-Tenant 头(不臆造 Casdoor 租户映射,待明确后再启用)。
    tenant-claim: ${WORKFLOW_TENANT_CLAIM:}

flowable:
  # Phase 0 dev 允许引擎自建/升级 ACT_* 表以验证兼容;生产在锁版后改 false + 版本化官方 DDL(FINAL_PLAN §11.1)
  database-schema-update: true
  # server 承载运行时,开启 async executor 驱动 timer/异步任务
  async-executor-activate: true
  # 自动部署由 admin 负责;server 不从 classpath 自动部署,避免双写
  check-process-definitions: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
