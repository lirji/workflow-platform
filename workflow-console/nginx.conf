server {
    listen 8302;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代到中台 REST(免 CORS);默认指向 compose 服务名,按部署环境调整 upstream。
    # 前端注入的 X-Workflow-Tenant / Authorization 头默认透传。
    location /api/ {
        proxy_pass http://workflow-platform-server:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存(带 hash 的 assets 可长缓存)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
