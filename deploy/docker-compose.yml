# 流程/审批中台本地全栈:PostgreSQL(Flowable ACT_* + 平台 wf_* 表)+ Redis + Kafka + 后端 + 前端。
# 纪律(risk/auth 都踩过 docker-proxy 残留占端口):独立 project name + 端口全变量化 +
# 起前先 `docker compose -p workflow-platform down --remove-orphans`。见 deploy/scripts/compose-preflight.sh。
name: workflow-platform

services:
  postgres:
    image: postgres:16
    container_name: workflow-postgres
    environment:
      POSTGRES_DB: ${WORKFLOW_PG_DB:-workflow}
      POSTGRES_USER: ${WORKFLOW_PG_USER:-workflow}
      POSTGRES_PASSWORD: ${WORKFLOW_PG_PASSWORD:-workflow}
    ports:
      - "${WORKFLOW_PG_PORT:-25432}:5432"
    volumes:
      - workflow-pg-data:/var/lib/postgresql/data
      # 干净库一键建 Flowable ACT_*(固化官方 DDL,见 ADR 0001)。仅首次初始化空卷时执行;
      # 生产 schema-update=false 时靠它初始化 ACT_*,wf_* 仍由应用 Flyway 建。
      - ./postgres/flowable-7.1.0:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WORKFLOW_PG_USER:-workflow} -d ${WORKFLOW_PG_DB:-workflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: workflow-redis
    ports:
      - "${WORKFLOW_REDIS_PORT:-26379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka(KRaft 单节点,无 ZooKeeper)。容器内其它服务用 kafka:9092;host 用 :${WORKFLOW_KAFKA_HOST_PORT}。
  kafka:
    image: apache/kafka:3.8.0
    container_name: workflow-kafka
    ports:
      - "${WORKFLOW_KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 运行时服务 :8300(待办/办理/实例轨迹 + Kafka 消费/outbox)。
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    image: workflow-platform-server:local
    container_name: workflow-server
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${WORKFLOW_SPRING_PROFILES_ACTIVE:-dev}
      WORKFLOW_DB_URL: jdbc:postgresql://postgres:5432/${WORKFLOW_PG_DB:-workflow}
      WORKFLOW_DB_USER: ${WORKFLOW_PG_USER:-workflow}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_PG_PASSWORD:-workflow}
      WORKFLOW_KAFKA: kafka:9092
      WORKFLOW_KAFKA_DELIVERY_TIMEOUT_MS: ${WORKFLOW_KAFKA_DELIVERY_TIMEOUT_MS:-8000}
      WORKFLOW_KAFKA_REQUEST_TIMEOUT_MS: ${WORKFLOW_KAFKA_REQUEST_TIMEOUT_MS:-5000}
      WORKFLOW_KAFKA_MAX_BLOCK_MS: ${WORKFLOW_KAFKA_MAX_BLOCK_MS:-5000}
      WORKFLOW_OUTBOX_SEND_TIMEOUT_SECONDS: ${WORKFLOW_OUTBOX_SEND_TIMEOUT_SECONDS:-10}
      WORKFLOW_OUTBOX_MAX_ATTEMPTS: ${WORKFLOW_OUTBOX_MAX_ATTEMPTS:-10}
      WORKFLOW_OUTBOX_RETRY_BACKOFF_SECONDS: ${WORKFLOW_OUTBOX_RETRY_BACKOFF_SECONDS:-5}
      # 生产置 false(靠固化官方 DDL 初始化 ACT_*);dev 默认 true 由引擎自建。
      WORKFLOW_FLOWABLE_SCHEMA_UPDATE: ${WORKFLOW_FLOWABLE_SCHEMA_UPDATE:-true}
      WORKFLOW_SECURITY_ENABLED: ${WORKFLOW_SECURITY_ENABLED:-false}
      WORKFLOW_OIDC_ISSUER: ${WORKFLOW_OIDC_ISSUER:-}
      WORKFLOW_OIDC_JWKS: ${WORKFLOW_OIDC_JWKS:-}
      WORKFLOW_OIDC_AUDIENCE: ${WORKFLOW_OIDC_AUDIENCE:-}
      WORKFLOW_GROUPS_CLAIM: ${WORKFLOW_GROUPS_CLAIM:-groups}
      WORKFLOW_TENANT_CLAIM: ${WORKFLOW_TENANT_CLAIM:-}
      WORKFLOW_KAFKA_TRUST_ENABLED: ${WORKFLOW_KAFKA_TRUST_ENABLED:-false}
      WORKFLOW_KAFKA_SOURCE_TENANT_BINDINGS: ${WORKFLOW_KAFKA_SOURCE_TENANT_BINDINGS:-}
      WORKFLOW_KAFKA_SOURCE_SIGNING_KEYS: ${WORKFLOW_KAFKA_SOURCE_SIGNING_KEYS:-}
    ports:
      - "${WORKFLOW_SERVER_PORT:-8300}:8300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8300/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 管理服务 :8301(部署/版本管理/审计;本轮为骨架,P1 补面板)。仅依赖 PG。
  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: admin
    image: workflow-platform-admin:local
    container_name: workflow-admin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WORKFLOW_DB_URL: jdbc:postgresql://postgres:5432/${WORKFLOW_PG_DB:-workflow}
      WORKFLOW_DB_USER: ${WORKFLOW_PG_USER:-workflow}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_PG_PASSWORD:-workflow}
      WORKFLOW_FLOWABLE_SCHEMA_UPDATE: ${WORKFLOW_FLOWABLE_SCHEMA_UPDATE:-true}
    ports:
      - "${WORKFLOW_ADMIN_PORT:-8301}:8301"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8301/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 前端控制台 :8302(nginx 静态站，同源 /api 反代到 server:8300)。
  console:
    build:
      context: ../workflow-console
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WORKFLOW_TENANT: ${VITE_WORKFLOW_TENANT:-his}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
        VITE_CASDOOR_AUTHORITY: ${VITE_CASDOOR_AUTHORITY:-http://localhost:8000}
        VITE_CASDOOR_CLIENT_ID: ${VITE_CASDOOR_CLIENT_ID:-}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile}
    image: workflow-console:local
    container_name: workflow-console
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WORKFLOW_CONSOLE_PORT:-8302}:8302"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8302/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  workflow-pg-data:
