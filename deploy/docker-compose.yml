# 流程/审批中台本地基建:独立 PostgreSQL(Flowable ACT_* + 平台 wf_* 表)+ Redis(缓存预留)。
# 纪律(risk/auth 都踩过 docker-proxy 残留占端口):独立 project name + 端口全变量化 +
# 起前先 `docker compose -p workflow-platform down --remove-orphans`。见 deploy/scripts/compose-preflight.sh。
name: workflow-platform

services:
  postgres:
    image: postgres:16
    container_name: workflow-postgres
    environment:
      POSTGRES_DB: ${WORKFLOW_PG_DB:-workflow}
      POSTGRES_USER: ${WORKFLOW_PG_USER:-workflow}
      POSTGRES_PASSWORD: ${WORKFLOW_PG_PASSWORD:-workflow}
    ports:
      - "${WORKFLOW_PG_PORT:-25432}:5432"
    volumes:
      - workflow-pg-data:/var/lib/postgresql/data
      # 干净库一键建 Flowable ACT_*(固化官方 DDL,见 ADR 0001)。仅首次初始化空卷时执行;
      # 生产 schema-update=false 时靠它初始化 ACT_*,wf_* 仍由应用 Flyway 建。
      - ./postgres/flowable-7.1.0:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WORKFLOW_PG_USER:-workflow} -d ${WORKFLOW_PG_DB:-workflow}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: workflow-redis
    ports:
      - "${WORKFLOW_REDIS_PORT:-26379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka(KRaft 单节点,无 ZooKeeper)。容器内其它服务用 kafka:9092;host 用 :${WORKFLOW_KAFKA_HOST_PORT}。
  kafka:
    image: apache/kafka:3.8.0
    container_name: workflow-kafka
    ports:
      - "${WORKFLOW_KAFKA_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 运行时服务 :8300(待办/办理/实例轨迹 + Kafka 消费/outbox)。
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    image: workflow-platform-server:local
    container_name: workflow-server
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      WORKFLOW_DB_URL: jdbc:postgresql://postgres:5432/${WORKFLOW_PG_DB:-workflow}
      WORKFLOW_DB_USER: ${WORKFLOW_PG_USER:-workflow}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_PG_PASSWORD:-workflow}
      WORKFLOW_KAFKA: kafka:9092
      # 生产置 false(靠固化官方 DDL 初始化 ACT_*);dev 默认 true 由引擎自建。
      WORKFLOW_FLOWABLE_SCHEMA_UPDATE: ${WORKFLOW_FLOWABLE_SCHEMA_UPDATE:-true}
      WORKFLOW_SECURITY_ENABLED: ${WORKFLOW_SECURITY_ENABLED:-false}
      WORKFLOW_OIDC_JWKS: ${WORKFLOW_OIDC_JWKS:-}
      WORKFLOW_TENANT_CLAIM: ${WORKFLOW_TENANT_CLAIM:-}
    ports:
      - "${WORKFLOW_SERVER_PORT:-8300}:8300"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8300/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # 管理服务 :8301(部署/版本管理/审计;本轮为骨架,P1 补面板)。仅依赖 PG。
  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: admin
    image: workflow-platform-admin:local
    container_name: workflow-admin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WORKFLOW_DB_URL: jdbc:postgresql://postgres:5432/${WORKFLOW_PG_DB:-workflow}
      WORKFLOW_DB_USER: ${WORKFLOW_PG_USER:-workflow}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_PG_PASSWORD:-workflow}
      WORKFLOW_FLOWABLE_SCHEMA_UPDATE: ${WORKFLOW_FLOWABLE_SCHEMA_UPDATE:-true}
    ports:
      - "${WORKFLOW_ADMIN_PORT:-8301}:8301"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8301/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  workflow-pg-data:
